name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate all project ledgers (skip if workspace empty)
        run: |
          found=0
          for f in workspace/*/ledger.json; do
            [ -f "$f" ] || continue
            found=1
            node tools/validate.mjs "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "ℹ️ workspace/ 无项目（框架仓库默认状态），跳过 ledger 校验"
          fi

      - name: Verify all SKILL.md have eval.md
        run: |
          for dir in skills/*/; do
            skill=$(basename "$dir")
            if [ ! -f "skills/$skill/eval.md" ]; then
              echo "❌ Missing eval.md: skills/$skill"
              exit 1
            fi
          done
          echo "✅ All skills have eval.md"

      - name: Verify all SKILL.md have frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "❌ Missing frontmatter: $f"
              exit 1
            fi
          done
          echo "✅ All SKILL.md have frontmatter"
